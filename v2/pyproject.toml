[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chemflow-research-engine"
version = "2.0.0.dev4"
description = "Compile, schedule and verify computational chemistry studies"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
kinetics = ["numpy", "scipy"]

[project.scripts]
chemflow2 = "chemflow2.__main__:entrypoint"

[tool.setuptools]
packages = ["chemflow2", "chemflow2._upstream.chemflow", "chemflow2._deploy"]

[tool.setuptools.package-dir]
"chemflow2._upstream.chemflow" = "vendor/chemflow-v1/chemflow"
"chemflow2._deploy" = "deploy"

[tool.setuptools.package-data]
"chemflow2._deploy" = ["byol.Dockerfile"]
